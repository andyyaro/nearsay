  <script>
    (function () {
      const TM = window.TM, C = TM.cues, REC = TM.rec, VO = window.VO;
      const S0 = TM.s3[0], S1 = TM.s3[1];
      const at = (k) => TM.rec0 + REC[k] - S0;           // a moment of the recording, in this scene's time
      const r = (t) => t - S0;
      const since = (k) => "+" + (REC[k] - REC.tap).toFixed(1) + " s";
      document.querySelector("#sb").textContent = since("banner");
      document.querySelector("#sc").textContent = since("claude");
      document.querySelector("#sr").textContent = since("rc");
      document.querySelector("#sy").textContent = since("reply");
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t, y = 14) => tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const on = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
      const off = (sel, t, d = 0.12) => tl.to(sel, { opacity: 0, duration: d, ease: "none" }, t);

      // the title while the phone comes in; gone before the camera reaches the phone
      tl.fromTo("#s-top", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.2);
      tl.to("#s-top", { opacity: 0, duration: 0.35, ease: "power1.in" }, r(C.t_contact) + 0.25);

      // the clock: runs in real time from the tap to Claude's reply, then holds
      pop("#rt", at("tap") - 0.35);
      const n = { v: 0 }, ne = document.querySelector("#rt-v");
      tl.fromTo(n, { v: 0 }, { v: REC.reply - REC.tap, duration: REC.reply - REC.tap, ease: "none",
        onUpdate: () => { ne.textContent = n.v.toFixed(1); } }, at("tap"));

      // the Mac: the Terminal opens; the banner; Claude Code starts with the words as its task; remote control; the reply
      tl.fromTo("#mac", { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.4)", transformOrigin: "50% 60%" }, at("term"));
      on("#r-banner", at("banner")); tl.set("#cur0", { y: 40 }, at("banner"));
      off("#r-banner", at("claude")); off("#cur0", at("claude"));
      on("#r-head", at("claude")); on("#r-prompt", at("claude")); on("#inp", at("claude")); on("#st1", at("claude"));
      off("#rc-a", at("rc")); on("#rc-b", at("rc")); on("#r-rc", at("rc"));
      tl.set("#st1", { opacity: 0 }, at("think")); tl.set("#st2", { opacity: 1 }, at("think"));
      off("#st2", at("reply")); on("#r-reply", at("reply")); on("#r-brew", at("reply"));

      // the phone: the Shortcut's reply, then the Claude app's
      pop("#ph-l", at("phone_ok") - 0.1, 10);
      pop("#n1", at("phone_ok"));
      off("#n1", at("phone_rc") - 0.3, 0.25);
      pop("#n2", at("phone_rc"));
      // "...so the lid can stay closed": the Mac has to be awake (nearsay's README, limitation 6)
      const lidW = VO.v08.words.find((w) => /^lid/.test(w.w.toLowerCase()));
      const tLid = r(lidW.t0) - 0.25;
      off("#n2", tLid - 0.3, 0.25); off("#ph-l", tLid - 0.3, 0.25);
      pop("#lid", tLid);

      tl.to(["#rt", "#mac", "#lid"], { opacity: 0, duration: 0.35, ease: "power1.in" }, S1 - S0 - 0.75);
      window.__timelines["s3-tap"] = tl;
    })();
