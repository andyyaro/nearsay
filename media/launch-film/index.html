    <meta charset="utf-8" />

    <title>nearsay: launch film</title>

    <style>
      /* nearsay's own brand (docs/assets in the repo): teal #19C7B5, cream #FFF7E8, ink #06292B. Text in Geist;
         kickers in Montserrat SemiBold caps (the films' label style). No monospace anywhere: the Terminal text, the
         program names and the paths are set in Geist too. */
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Medium.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Bold.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat-SemiBold.woff2") format("woff2"); font-weight: 600; }
      :root {
        --teal: #19c7b5; --cream: #fff7e8; --ink: #06292b;
        --teal-ink: #0a7d72;         /* teal for text on cream: 4.6:1 on #fff7e8 */
        --ink-2: #3f5759;            /* secondary text on cream: 7.4:1 */
        --ink-3: #566b6d;            /* secondary text on white */
        --card: #ffffff; --line: rgba(6, 41, 43, 0.12); --fill: rgba(6, 41, 43, 0.06);
        --green: #1f9d55; --orange: #ff8d28; --red: #e5383b; --claude: #d97757; --purple: #a259ff;
        /* the Mac's Terminal and the phone's notifications, redrawn (dark, as they are on the devices) */
        --term: #1f2021; --term-bar: #2b2c2d; --term-text: #dcdedf; --term-dim: #9a9ea0;
        --font: "Geist", -apple-system, system-ui, sans-serif;
        --label: "Montserrat", "Geist", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
      #main { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--ink); font-family: var(--font);
              -webkit-font-smoothing: antialiased; }
      #bg { position: absolute; inset: 0; background: var(--cream); }
      video.clip { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }

      /* ---- shared parts ---- */
      .ic { display: block; width: 1em; height: 1em; flex: none; overflow: visible; }
      .kicker { font-family: var(--label); font-weight: 600; font-size: 24px; line-height: 30px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink); }
      .head { font-weight: 700; font-size: 64px; line-height: 70px; letter-spacing: -1.4px; color: var(--ink); }
      .topleft { position: absolute; left: 96px; top: 84px; display: flex; flex-direction: column; gap: 16px; max-width: 1100px; }
      .chip { display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px 12px 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.86);
              font-size: 28px; line-height: 34px; font-weight: 500; color: var(--ink); white-space: nowrap; }
      .chip .ic { font-size: 28px; }
      .dot { display: block; flex: none; width: 14px; height: 14px; border-radius: 50%; background: #8e8e93; }
      .dot.g { background: var(--green); } .dot.o { background: var(--orange); } .dot.r { background: var(--red); } .dot.t { background: var(--teal); }
      .tnum { font-variant-numeric: tabular-nums; }

      /* burned-in subtitles (compositions/subs.html, track 9): a dark pill at the bottom; the band y >= 936 stays clear */
      #subtitles { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
      .sub { position: absolute; left: 0; right: 0; bottom: 30px; margin: 0 auto; width: fit-content; max-width: 1240px;
             padding: 8px 26px 10px; border-radius: 18px; background: rgba(0, 0, 0, 0.74); color: #ffffff; white-space: pre-line;
             font-size: 38px; line-height: 47px; font-weight: 500; letter-spacing: -0.1px; text-align: center; }
    </style>
